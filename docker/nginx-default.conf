# SEO edge injection (njs) — script: docker/seo.js.
# Hut metadata subrequests are cached on disk; mount a volume at
# /var/cache/nginx/seo to persist the cache across restarts. The TTL
# comes from WODORE_SEO_CACHE_TTL (placeholder replaced by the
# entrypoint, in seconds; upstream Cache-Control is ignored on purpose
# so the env var stays the single source of truth).
proxy_cache_path /var/cache/nginx/seo levels=1:2 keys_zone=seo_meta:5m
                 max_size=256m inactive=8d use_temp_path=off;

# njs reads subrequest responses (SPA shell, hut meta) into memory
# buffers of this size — the default is too small for the index.html
# shell, which then fails with "too big subrequest response".
subrequest_output_buffer_size 256k;

js_import seo from /etc/nginx/seo.js;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No cache for critical files that need immediate updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    location ~* (sw\.js|service-worker\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Very short cache for robots.txt (1 hour) — sitemap*.xml is proxied
    # to the backend API further down.
    location ~* robots\.txt$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Runtime env for the SPA (external so the HTML shell stays free of
    # volatile values — see public/env.js): same no-store policy that
    # index.html always had. This is what keeps hut pages cacheable while
    # env changes still reach every client on the next visit.
    location = /env.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SEO/LLM surfaces are generated by the backend API (see
    # wodore-backend: /v1/sitemap*.xml, /llms.txt) and proxied here so
    # every sitemap/llms URL lives on the site it describes. The API
    # host placeholder is replaced at container start (entrypoint.sh).
    # Frontend and backend paths are identical modulo the /v1 prefix,
    # which covers the index and all child sitemaps (sitemap-static,
    # sitemap-huts-N, later sitemap-places-N, ...).
    location ~ ^/sitemap.*\.xml$ {
        rewrite ^/sitemap(.*)\.xml$ /v1/sitemap$1.xml break;
        proxy_pass __WODORE_API_HOST__;
        # Matches the backend cache TTL: hut data changes infrequently.
        expires 48h;
        add_header Cache-Control "public, max-age=172800";
    }

    location = /llms.txt {
        proxy_pass __WODORE_API_HOST__/llms.txt;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Hut pages: njs injects per-hut meta tags into the SPA shell.
    # The response itself stays no-store (runtime env vars baked into
    # index.html must reach clients on the next visit); only the
    # metadata subrequest below is cached.
    location /hut/ {
        js_content seo.hut;
    }

    # Internal: hut metadata from the API, disk-cached (see
    # proxy_cache_path above). Non-200 answers make njs serve the plain
    # shell; stale entries are served while the backend is down.
    location /_seo/meta/ {
        internal;
        rewrite ^/_seo/meta/(.+)$ /v1/huts/$1/meta break;
        proxy_pass __WODORE_API_HOST__;
        # Fail fast: a slow/down backend must not stall hut pages — njs
        # serves the plain shell instead (stale cache if available).
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache seo_meta;
        proxy_cache_valid 200 __WODORE_SEO_CACHE_TTL__s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Internal: the SPA shell, served as-is for njs to rewrite.
    location = /_seo/shell {
        internal;
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Long cache for hashed workbox files (1 year)
    location ~* ^/workbox-.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long cache for everything in /assets/ directory (1 year)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Short cache for all other static files (4 hours)
    # This includes root-level files like favicon, manifest, robots.txt, etc.
    location / {
        try_files $uri /index.html;
        expires 4h;
        add_header Cache-Control "public, max-age=14400";
    }

    # Enable Brotli & Gzip Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/manifest+json;
    gzip_static on;

    # Staging
    # add_header X-Robots-Tag "noindex, nofollow" always;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Allow Geolocation Access
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()";

    # Hide Nginx Version
    server_tokens off;

    # Access and Error Logs
    access_log /dev/stdout;
    error_log /dev/stderr;
}

