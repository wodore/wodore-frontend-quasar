# SEO edge injection (njs) — script: docker/seo.js.
# Hut metadata subrequests are cached as small files (~1 KB per hut:
# ~3 MB today, ~10 MB at 10k huts). Back it with disk (mount a volume at
# /var/cache/nginx/seo) or with memory (Docker: --tmpfs
# /var/cache/nginx/seo:rw,noexec,nosuid,size=64m — Kubernetes: emptyDir
# with medium: Memory, sizeLimit 64Mi); the entrypoint fixes ownership
# either way. The TTL comes from WODORE_SEO_CACHE_TTL (placeholder
# replaced by the entrypoint, in seconds; upstream Cache-Control is
# ignored on purpose so the env var stays the single source of truth).
# max_size caps the store at 64 MB regardless of the backing volume.
proxy_cache_path /var/cache/nginx/seo levels=1:2 keys_zone=seo_meta:5m
                 max_size=64m inactive=8d use_temp_path=off;

# njs reads subrequest responses (SPA shell, hut meta) into memory
# buffers of this size — the default is too small for the index.html
# shell, which then fails with "too big subrequest response".
subrequest_output_buffer_size 256k;

js_import seo from /etc/nginx/seo.js;

# Hidden CDN pull origins (orig.*): this single server block serves the
# public sites (wodore.com, wodo.re, stg.*) AND their CDN origin
# hostnames (orig.wodore.com, orig.wodo.re, orig.stg.*), which are
# publicly resolvable through the *.wodore.com wildcard DNS — without
# this they are fully crawlable duplicates of the real sites (they would
# serve the environment's robots.txt, i.e. "Allow: /" in production).
# Origins are neutralized per-request on $host, environment-independent:
# deny-all robots.txt ($robots_txt) + X-Robots-Tag: noindex
# ($x_robots_tag).
#
# $x_robots_tag's default branch is a placeholder the entrypoint fills
# from WODORE_ENV: "noindex, nofollow" outside production (staging
# public host: defense-in-depth next to its robots.txt Disallow — robots
# rules never reach crawlers that fetch robots.txt lazily, the header
# does), "" in production. nginx emits NO header at all for an empty
# add_header value, so production public hosts stay byte-identical.
map $host $x_robots_tag {
    ~^orig\.  "noindex, nofollow";
    default   __WODORE_STAGING_X_ROBOTS__;
}

# Which robots.txt to serve: orig.* always the deny-all copy
# (robots-origin.txt, written by the entrypoint), everyone else the
# WODORE_ENV-selected robots.txt (production: the crawlable Allow one
# shipped by the build; staging: the entrypoint's deny-all overwrite).
map $host $robots_txt {
    ~^orig\.  /robots-origin.txt;
    default   /robots.txt;
}

# Kubernetes API upstream override (WODORE_API_UPSTREAM, entrypoint.sh):
# when set, every API proxy_pass below targets http://$wodore_api_upstream
# (an in-cluster service) instead of the public hub hostname, resolved at
# REQUEST time via this resolver — nginx resolves a static proxy_pass host
# at CONFIG-LOAD time, and the 2026-10-25 public-DNS outage crash-looped
# the deployment ([emerg] host not found in upstream). The entrypoint
# injects the cluster DNS nameserver (from /etc/resolv.conf) and the
# proxy locations get proxy_set_header Host <public hub host> +
# X-Forwarded-Proto https (Django ALLOWED_HOSTS and https URL building
# depend on them; Traefik's TLS edge is bypassed on this path). Without
# the override this line is removed — public hostname, exactly as before.
__WODORE_API_UPSTREAM_RESOLVER__

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Language redirects (seo.js) set RELATIVE Location values. nginx
    # would absolutize them from its own listener — http://<host>:8080/…
    # — which is unreachable from behind the TLS edge: social crawlers
    # dropped the og preview and first-visit users timed out following
    # the 301/302. Keep Location relative; every client resolves it
    # against the request URL.
    absolute_redirect off;

    # WODORE_API_UPSTREAM set: host:port of the in-cluster backend
    # service for every API proxy below (see the resolver note at the
    # top). Removed when the override is unset.
    __WODORE_API_UPSTREAM_SET__

    # No cache for critical files that need immediate updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag $x_robots_tag always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://stats.wodore.com" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag $x_robots_tag always;
        try_files $uri =404;
    }

    location ~* (sw\.js|service-worker\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Very short cache for robots.txt (1 hour) — sitemap*.xml is proxied
    # to the backend API further down. The served file comes from the
    # $robots_txt $host map at the top of this file: orig.* CDN origins
    # always get the deny-all copy, everyone else the WODORE_ENV one.
    location ~* robots\.txt$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag $x_robots_tag always;
        try_files $robots_txt =404;
    }

    # Runtime env for the SPA (external so the HTML shell stays free of
    # volatile values — see public/env.js): same no-store policy that
    # index.html always had. This is what keeps hut pages cacheable while
    # env changes still reach every client on the next visit.
    location = /env.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # SEO/LLM surfaces are generated by the backend API (see
    # wodore-backend: /v1/sitemap*.xml, /llms[.lang].txt) and proxied
    # here so every sitemap/llms URL lives on the site it describes. The API
    # host placeholder is replaced at container start (entrypoint.sh);
    # with WODORE_PUBLIC_API_URL set (and no WODORE_API_UPSTREAM),
    # these public fetches go through the CDN base instead — see the
    # entrypoint's upstream block for the precedence rules.
    # Frontend and backend paths are identical modulo the /v1 prefix,
    # which covers the index and all child sitemaps (sitemap-static,
    # sitemap-huts-N, later sitemap-places-N, ...).
    location ~ ^/sitemap.*\.xml$ {
        rewrite ^/sitemap(.*)\.xml$ /v1/sitemap$1.xml break;
        proxy_pass __WODORE_API_HOST__;
        __WODORE_API_UPSTREAM_HEADERS__
        # Cache-Control comes from the backend (children 48 h, index 1 h) —
        # no expires/add_header here to avoid duplicate Cache-Control lines.
    }

    # The llms family: /llms.txt plus its per-language variants
    # (/llms.de.txt, /llms.fr.txt, /llms.it.txt — backend #419). Any
    # two-letter variant is proxied so an UNKNOWN language reaches the
    # backend and IT 404s it — the SPA fallback must not swallow the
    # family with a 200 shell. Regex locations cannot carry a URI in
    # proxy_pass (same as the sitemap location above), and none is
    # needed: frontend and backend paths are identical for this family,
    # so the request URI is passed through unchanged (no /v1 rewrite).
    # The pattern is quoted: nginx's config parser splits an unquoted
    # regex at the { } quantifier braces (pcre2 then sees a truncated
    # pattern — "missing closing parenthesis").
    location ~ "^/llms(\.[a-z]{2})?\.txt$" {
        proxy_pass __WODORE_API_HOST__;
        __WODORE_API_UPSTREAM_HEADERS__
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Hut pages as Markdown, served from the backend on the main domain:
    # wodore.com/hut/{slug}.md is the same document as /hut/{slug},
    # machine-readable (linked from /llms.txt). The regex wins over the
    # /hut/ prefix location (njs) on purpose: only .md URLs are proxied,
    # the ?lang=... query passes through (rewrite keeps args).
    location ~ ^/hut/(.+)\.md$ {
        rewrite ^/hut/(.+)\.md$ /v1/huts/$1.md break;
        proxy_pass __WODORE_API_HOST__;
        __WODORE_API_UPSTREAM_HEADERS__
        # Cache-Control (public, max-age=3600) comes from the backend.
    }

    # Hut pages: njs injects per-hut meta tags into the SPA shell.
    # The response itself stays no-store (runtime env vars baked into
    # index.html must reach clients on the next visit); only the
    # metadata subrequest below is cached.
    location /hut/ {
        js_content seo.hut;
    }

    # Locale-prefixed hut pages (/de|/en|/fr|/it/hut/...): same njs
    # handler; the prefix localizes the injected meta and drives the
    # canonical/hreflang cluster (full-prefix model — no language is
    # served from the bare URL alone for crawlers).
    location ~ ^/(en|fr|it|de)/hut/ {
        js_content seo.hut;
    }

    # Internal: hut metadata from the API, disk-cached (see
    # proxy_cache_path above). Non-200 answers make njs serve the plain
    # shell; stale entries are served while the backend is down.
    location /_seo/meta/ {
        internal;
        rewrite ^/_seo/meta/(.+)$ /v1/huts/$1/meta break;
        proxy_pass __WODORE_API_HOST__;
        # Force identity upstream: Traefik injects "Accept-Encoding: gzip"
        # into every request it forwards (cluster ingress), the njs
        # subrequest inherits it, and r.subrequest's responseText is not
        # decompressed — the meta JSON would arrive gzip-mangled and fail
        # JSON.parse, degrading every hut page to the plain shell. It
        # would also cache the gzip variant under the (A-E-less) cache
        # key, poisoning the hut for the full cache TTL. The client-facing
        # proxy locations below keep pass-through compression.
        proxy_set_header Accept-Encoding "";
        __WODORE_API_UPSTREAM_HEADERS__
        # Fail fast: a slow/down backend must not stall hut pages — njs
        # serves the plain shell instead (stale cache if available).
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache seo_meta;
        proxy_cache_valid 200 __WODORE_SEO_CACHE_TTL__s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Internal: the SPA shell, served as-is for njs to rewrite.
    location = /_seo/shell {
        internal;
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # First-party Sentry envelope tunnel (sentry-tunnel): the browser
    # SDK POSTs envelopes here same-origin (the SDK's `tunnel` init
    # option, services/sentry.ts — web builds only) because ad blockers
    # (Brave, uBlock's EasyPrivacy list) block cross-origin
    # *.ingest.*.sentry.io requests with net::ERR_BLOCKED_BY_CLIENT
    # (observed on staging); first-party URLs are never blocked. nginx
    # forwards the body verbatim to the ingest endpoint; host/project/key
    # are derived by entrypoint.sh from the SAME WODORE_SENTRY_DSN that
    # replace_vars serves into /env.js, so the tunnel target can never
    # drift from the client DSN and a vendor swap (sentry.io ↔ Better
    # Stack) stays a DSN change + container restart. The public key is
    # not a secret — it ships in the client DSN anyway. Envelope API is
    # POST-only; anything else 405s. No DSN configured → the entrypoint
    # swaps the INERT placeholder for `return 404;` (the unreachable
    # proxy target below is then a literal 127.0.0.1 only so the config
    # stays loadable): dev/test/CI/PR previews stay telemetry-free and
    # unproxied — the SPA is DSN-gated too, nothing legitimately posts.
    location = /sentry-ingest {
        __WODORE_SENTRY_INGEST_INERT__
        if ($request_method != POST) { return 405; }
        proxy_pass https://__WODORE_SENTRY_INGEST_HOST__/api/__WODORE_SENTRY_INGEST_PROJECT__/envelope/?sentry_key=__WODORE_SENTRY_INGEST_KEY__;
        # Name-based HTTPS ingest endpoint (sentry.io / Better Stack):
        # without SNI the TLS handshake presents the wrong certificate;
        # the Host header selects the vhost (nginx's default $proxy_host
        # would send our own site name).
        proxy_ssl_server_name on;
        proxy_set_header Host __WODORE_SENTRY_INGEST_HOST__;
    }

    # Long cache for hashed workbox files (1 year)
    location ~* ^/workbox-.*\.js$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Long cache for everything in /assets/ directory (1 year)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag $x_robots_tag always;
    }

    # Short cache for all other static files (4 hours)
    # This includes root-level files like favicon, manifest, robots.txt, etc.
    # SPA fallback goes through @spa: the shell served for / and /hut/...
    # must NOT inherit this 4h cache — a stale shell keeps referencing
    # deleted hashed assets for hours after a deploy (the `= /index.html`
    # no-store block above only matches the exact path, not the
    # try_files fallback).
    location / {
        try_files $uri @spa;
        expires 4h;
        add_header Cache-Control "public, max-age=14400";
        add_header X-Robots-Tag $x_robots_tag always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://stats.wodore.com" always;
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Robots-Tag $x_robots_tag always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://stats.wodore.com" always;
    }

    # Enable Brotli & Gzip Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/manifest+json;
    gzip_static on;
    # The build ships .gz/.br siblings for hashed assets (quasar.config.ts
    # → vite-plugin-compression2); gzip_static/brotli_static serve them
    # as-is, so clients that accept both encodings get the smaller .br.
    # The module comes from Alpine's nginx-mod-http-brotli (Dockerfile)
    # and loads via /etc/nginx/modules/10_http_brotli.conf, like njs.
    brotli_static on;
    # On-the-fly brotli for everything WITHOUT a precompressed sibling —
    # critically the SPA shell: replace_vars/the staging noindex sed
    # rewrite index.html at container start, so a build-time index.html.br
    # would go STALE; dynamic compression stays correct (25KB → ~5.6KB).
    # Also covers env.js (no sibling, ~1.8KB → ~0.7KB). Hashed assets hit
    # brotli_static above and never pay the per-request CPU.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/manifest+json;

    # X-Robots-Tag for hidden hosts — value from the $host map at the
    # top of this file (orig.* CDN origins always; staging public host
    # via the entrypoint-filled placeholder; production public hosts map
    # to "" = no header at all). Replaces the old staging sed-uncommented
    # header, which — through nginx's add_header inheritance rule (a
    # location with ANY add_header of its own drops ALL server-level
    # ones) — only ever reached the few locations without their own
    # add_header. The content locations above therefore repeat the line.
    add_header X-Robots-Tag $x_robots_tag always;

    # Security Headers
    # NOTE: no full Content-Security-Policy here — this app is inherently
    # cross-origin (API host, imagor, tile servers, OIDC, Stripe) and a
    # 'self'-only policy breaks it. The line used to sit at server level
    # where it was dead config (locations with their own add_header never
    # inherited it) until the njs /hut/ location — the first content
    # location without its own add_header — exposed it and blocked all
    # API calls on hut pages. Build a real CSP with the runtime hosts if
    # one is ever wanted (entrypoint knows WODORE_API_HOST etc.).
    #
    # The ONE directive shipped today is frame-ancestors-only: it solely
    # controls who may EMBED these pages (Umami's heatmap live preview
    # iframes the site from stats.wodore.com; everyone else is refused —
    # free clickjacking hardening) and cannot affect any fetch the app
    # makes. Like X-Robots-Tag it is dropped by locations with their own
    # add_header, so the HTML-serving locations repeat it; the njs /hut/
    # locations have no own add_header and inherit this one.
    # NOTE: this assumes the Umami dashboard lives on stats.wodore.com
    # in EVERY environment. If an environment ever points
    # WODORE_UMAMI_WEBSITE_URL at a different instance, extend this
    # list (or convert it to an entrypoint-filled placeholder like
    # __WODORE_API_HOST__) — otherwise that environment's heatmap
    # preview iframe is silently blocked.
    add_header Content-Security-Policy "frame-ancestors 'self' https://stats.wodore.com" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow Geolocation Access
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()";

    # Hide Nginx Version
    server_tokens off;

    # Access and Error Logs
    access_log /dev/stdout;
    error_log /dev/stderr;
}

