<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PR Preview moved</title>
<script>
(async function () {
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map(function (k) { return caches.delete(k); }));
  }
  if (navigator.serviceWorker) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(function (r) { return r.unregister(); }));
  }
  window.location.replace('https://wodore.github.io/wodore-frontend-quasar/pr-150/5d17b41b/');
})();
</script>
</head>
<body>Clearing preview cache and redirecting to the latest build...</body>
</html>
