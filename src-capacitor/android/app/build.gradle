apply plugin: 'com.android.application'

android {
    namespace "com.wodore.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wodore.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Dev/preview builds carry a UTC timestamp + commit hash instead of
    // a semver — the next release number is unknown until the tag exists.
    // Release keeps the versionName synced from tags via release.sh.
    def buildTs = new Date().format('yyyyMMddHHmmss', TimeZone.getTimeZone('UTC'))
    def gitSha = 'git rev-parse --short=7 HEAD'.execute().text.trim()

    flavorDimensions 'env'
    productFlavors {
        std {
            dimension 'env'
        }
        stg {
            // CI preview builds: com.wodore.stg.dev — the id mirrors
            // the staging environment baked into the APK.
            dimension 'env'
            applicationId 'com.wodore.stg'
            resValue 'string', 'app_name', 'Wodore Preview'
        }
    }
    signingConfigs {
        upload {
            // Release signing from CI (keystore decoded + passwords from
            // secrets in .github/workflows/android.yml); the release
            // build stays unsigned when the env vars are absent.
            def ksPath = System.getenv('WODORE_ANDROID_KEYSTORE_FILE')
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('WODORE_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WODORE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('WODORE_ANDROID_KEY_PASSWORD')
            }
        }
        ciDev {
            // Stable CI signing for preview/RC builds (WODORE_ANDROID_DEV_*
            // secrets): runner debug keystores rotate, which forced a
            // uninstall before every update. Absent locally (Studio) —
            // builds then use the standard debug keystore.
            def ksPath = System.getenv('WODORE_ANDROID_DEV_KEYSTORE_FILE')
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('WODORE_ANDROID_DEV_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WODORE_ANDROID_DEV_KEY_ALIAS')
                keyPassword System.getenv('WODORE_ANDROID_DEV_KEY_PASSWORD')
            }
        }
    }
    // Native ABI selection: MapLibre Native ships ~24MB of .so per
    // ABI (vulkan + opengl renderers). Defaults keep preview APKs
    // lean for phones; override with WD_NATIVE_ABIS (comma-separated)
    // for emulator or multi-ABI local builds.
    def nativeAbis = System.getenv('WD_NATIVE_ABIS')
    def resolveAbis = { defaults ->
        (nativeAbis != null && !nativeAbis.isEmpty())
            ? nativeAbis.split(',').toList().collect { it.trim() }
            : defaults
    }

    buildTypes {
        debug {
            // Android Studio builds (std+debug): com.wodore.app.local.
            // x86_64 included so the emulator works out of the box.
            ndk { abiFilters = resolveAbis(['arm64-v8a', 'x86_64']) }
            applicationIdSuffix '.local'
            resValue 'string', 'app_name', 'Wodore Dev'
            if (signingConfigs.ciDev.storeFile != null) {
                signingConfig signingConfigs.ciDev
            }
        }
        dev {
            // CI dev builds: std+dev = com.wodore.app.dev (production
            // backend, release-like, debug-signed), stg+dev =
            // com.wodore.stg.dev (staging backend preview).
            // arm64-v8a only: preview APKs go to phones via QR code.
            initWith debug
            ndk { abiFilters = resolveAbis(['arm64-v8a']) }
            applicationIdSuffix '.dev'
            matchingFallbacks = ['debug']
            // Explicit signing (initWith doesn't reliably copy
            // conditional signing configs from debug)
            if (signingConfigs.ciDev.storeFile != null) {
                signingConfig signingConfigs.ciDev
            }
            // Shrink the APK: R8 strips unused code paths from the
            // Capacitor runtime, AndroidX and plugin dependencies.
            // classes.dex alone is 8.2MB unminified.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // Play Store: com.wodore.app, semver synced from tags.
            // arm64-v8a: Play's AAB delivery re-splits per device
            // anyway; this keeps direct APK exports lean.
            ndk { abiFilters = resolveAbis(['arm64-v8a']) }
            // Only attach the signing config when the CI keystore env
            // exists — an empty config breaks release packaging.
            if (signingConfigs.upload.storeFile != null) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Compress native libs inside the APK (legacy packaging):
            // preview APKs are downloaded over the network via QR
            // code, where download size dominates. Tradeoff: libs
            // extract to disk at install and mmap start is slower.
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name != 'release') {
            // e.g. 20260927070300-45858db (timestamp-commit)
            variant.outputs.all { output ->
                output.versionNameOverride = "${buildTs}-${gitSha}"
            }
        }
        // Per-variant launcher names:
        // - stg+* = "Wodore Preview" (set via flavor resValue)
        // - std+debug = "Wodore Dev" (set via buildType resValue)
        // - std+dev = "Wodore Beta" (RC — production backend, not release)
        // - std+release = "Wodore" (from strings.xml, the default)
        if (variant.flavorName == 'std' && variant.buildType.name == 'dev') {
            variant.resValue 'string', 'app_name', 'Wodore Beta'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
