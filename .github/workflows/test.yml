name: Tests

on:
  workflow_dispatch: {} # manual runs on any branch (PAT PR events can be flaky)
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # JUnit check-run annotations (mikepenz/action-junit-report)
  checks: write

jobs:
  check-draft:
    runs-on: ubuntu-24.04  # 26.04 runners break Playwright chromium install (pinned 2026-10)
    steps:
      - id: is_draft
        run: echo "draft=${{ github.event.pull_request.draft || false }}" >> "$GITHUB_OUTPUT"
  # Skip ALL jobs when the PR is a draft (no tests, no preview, no APK)
  unit-tests:
    needs: check-draft
    if: needs.check-draft.outputs.draft != 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04  # 26.04 runners break Playwright chromium install (pinned 2026-10)

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Day stamp (staging cache key)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: pnpm

      - name: Cache vite/vitest transform cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Staging responses (API, tiles, fonts) cached across runs by the
      # tests themselves (tests/interaction/helpers.ts) — first fetch per
      # URL hits staging (drift detection stays), the rest replay local.
      # Daily key rotation keeps the data reasonably fresh.
      # Save is split from restore: a run whose interaction suite failed
      # must NOT persist its cache — failing desktop tests record churning
      # map/tile state, and a bloated cache then starves later runs of
      # map idle (2026-10-15: 18 MB of recorded churn vs the healthy
      # ~5 MB steady state).
      - name: Restore staging responses (rotates daily)
        uses: actions/cache/restore@v4
        with:
          path: tests/interaction/.staging-cache
          key: staging-cache-v1-${{ steps.date.outputs.day }}
          restore-keys: |
            staging-cache-v1-

      # NOTE: e2e (Playwright) is intentionally NOT run in CI — it requires a
      # real dev server + backend and stays a local-only suite for now.
      - name: Start dev server for interaction tests
        run: pnpm run dev --port 9000 &
        env:
          WODORE_API_HOST: >-
            ${{ vars.WODORE_API_HOST || 'https://hub.stg.wodore.com' }}

      - name: Run unit tests
        run: rm -rf allure-results && pnpm test:unit

      # JUnit XML (written on CI by vitest.config.ts) → failed tests show up
      # as inline check-run annotations — the native-ish test report.
      - name: JUnit report (annotations)
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: 'junit-results/*.xml'

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/ > /dev/null && break
            sleep 5
          done
          curl -sf http://localhost:9000/ > /dev/null \
            || (echo "Dev server not ready" && exit 1)

      # Diagnostics for the catalog boot-cache chain: if the runner cannot
      # reach the staging API, the 00-warmup caches nothing and every
      # downstream spec boots catalog-less (rows:0). A 401/403 here still
      # proves reachability — only timeouts/refused prove blockage.
      - name: Probe staging reachability
        env:
          WODORE_API_HOST: ${{ vars.WODORE_API_HOST }}
        run: |
          # Shell default keeps the fallback next to the probe.
          PROBE_HOST="${WODORE_API_HOST:-https://hub.stg.wodore.com}"
          curl -sS -o /dev/null --max-time 15 \
            -w "catalog endpoint: HTTP %{http_code} in %{time_total}s\n" \
            "$PROBE_HOST/v1/map/catalog?lang=en" \
            || echo "catalog endpoint UNREACHABLE from runner (curl exit $?)"

      - name: Run interaction tests (map controls)
        id: interaction
        run: |
          # Exclude visual-regression: reference screenshots are
          # environment-specific (fonts, GPU, antialiasing differ between
          # local and CI) — run locally with: pnpm test:interaction
          pnpm exec playwright test tests/interaction/ \
            --project=interaction --grep-invert "visual regression"
          node scripts/link-allure-attachments.mjs allure-results/e2e
        env:
          INTERACTION_BASE_URL: http://localhost:9000

      # Only a green interaction run may persist the staging cache —
      # see the restore step above for why failed runs must not.
      - name: Save staging responses (green runs only)
        if: always() && steps.interaction.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: tests/interaction/.staging-cache
          key: staging-cache-v1-${{ steps.date.outputs.day }}

      # Raw Allure results for the MANUAL report workflow
      # (.github/workflows/allure-report.yml) — cheap to upload, no
      # gh-pages publishing on regular runs.
      - name: Upload Allure results (for the manual report workflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright artifacts (traces + failure screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
