name: API contract

on:
  pull_request:
    paths:
      - 'src/clients/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - name: Regenerate types from the backend's committed snapshot
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            git@github.com:wodore/wodore-backend.git /tmp/backend
          cd /tmp/backend
          git sparse-checkout set server/apps/apiversions/openapi
          SNAPSHOT=$(ls server/apps/apiversions/openapi/*.json | sort | tail -1)
          cd $GITHUB_WORKSPACE
          npx -y openapi-typescript@7 "$SNAPSHOT" -o src/clients/wodore_v1.d.ts
      - name: Typecheck against the fresh types
        run: npx vue-tsc --noEmit -p tsconfig.json
