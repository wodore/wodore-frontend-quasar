name: API contract

on:
  pull_request:
    paths:
      - 'src/clients/**'
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — catches staging drift
  workflow_dispatch: {}  # manual trigger

jobs:
  check-types-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate types from the live staging spec
        run: |
          npx -y openapi-typescript@7 \
            https://hub.stg.wodore.com/v1/openapi.json \
            -o /tmp/fresh.d.ts

      - name: Compare against the committed types
        run: |
          # Format both the same way (prettier, same config as the repo)
          npx prettier --write /tmp/fresh.d.ts
          npx prettier --write src/clients/wodore_v1.d.ts

          if ! diff -u src/clients/wodore_v1.d.ts /tmp/fresh.d.ts; then
            echo ""
            echo "❌ Committed API types are stale against staging."
            echo ""
            echo "   The OpenAPI schema served by hub.stg.wodore.com has"
            echo "   changed since wodore_v1.d.ts was last regenerated."
            echo ""
            echo "   Fix: against a local backend, run:"
            echo "     pnpm gen:api-local"
            echo "   or against staging:"
            echo "     npx openapi-typescript https://hub.stg.wodore.com/v1/openapi.json -o src/clients/wodore_v1.d.ts"
            echo ""
            exit 1
          fi
          echo "✅ API types match staging."
