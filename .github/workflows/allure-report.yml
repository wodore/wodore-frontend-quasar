name: Allure Report (manual)

# Optional, on-demand Allure report from a Tests run's uploaded results.
# Regular CI runs no longer touch gh-pages (they used to spend ~7 minutes
# per run publishing reports nobody looked at) — dispatch this instead:
#
#   gh workflow run allure-report.yml -f run_id=<Tests run id>
#
# run_id empty → the latest completed Tests run on main.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Tests run id to report on (empty = latest on main)'
        required: false
        default: ''

permissions:
  contents: write # publishing to gh-pages

# gh-pages is shared with the Preview workflow's deploy — serialize every
# push to it or the two race and one loses ('failed to push some refs').
concurrency:
  group: gh-pages-push
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve source run
        id: src
        uses: actions/github-script@v7
        with:
          script: |
            let runId = '${{ inputs.run_id }}';
            if (!runId) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                branch: 'main',
                status: 'completed',
                per_page: 1,
              });
              if (!runs.data.workflow_runs.length) {
                core.setFailed('No completed Tests run on main found');
                return;
              }
              runId = String(runs.data.workflow_runs[0].id);
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(runId),
            });
            if (run.status !== 'completed') {
              core.setFailed(`Run ${runId} is not completed (${run.status})`);
              return;
            }
            const pr = run.pull_requests?.[0]?.number;
            core.setOutput('run_id', runId);
            core.setOutput('run_number', String(run.run_number));
            // PR runs report under allure/pr-N, everything else under allure/main
            core.setOutput('ctx', pr ? `allure/pr-${pr}` : 'allure/main');
            core.setOutput('url', run.html_url);

      - name: Download Allure results artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: allure-results
          path: allure-results

      # SINGLE gh-pages checkout (depth 1): history restore, report
      # publish, pruning and history update all reuse it — the old
      # pipeline checked gh-pages out twice and pushed twice per run.
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Restore Allure history
        run: |
          CTX="${{ steps.src.outputs.ctx }}"
          mkdir -p allure-results/history
          if [ -f "gh-pages/${CTX}/history/history.json" ]; then
            cp "gh-pages/${CTX}/history/history.json" allure-results/history/
          fi
          # merge unit + interaction/e2e results into one the report consumes
          mkdir -p allure-results/merged
          if [ -d allure-results/unit ]; then cp -R allure-results/unit/. allure-results/merged/; fi
          if [ -d allure-results/e2e ]; then cp -R allure-results/e2e/. allure-results/merged/; fi

      # allure-commandline v2: produces a static HTML report with DIRECT
      # file links to attachments — works on GitHub Pages sub-paths.
      # (allure@3 SPA falls back to blob: URLs on GH Pages → broken screenshots)
      - name: Generate Allure report
        run: npx -y allure-commandline generate allure-results/merged --clean

      - name: Publish report + history + prune (single commit)
        run: |
          CTX="${{ steps.src.outputs.ctx }}"
          RUN="${{ steps.src.outputs.run_number }}"
          # publish the run's report
          rm -rf "gh-pages/${CTX}/${RUN}"
          cp -R allure-report "gh-pages/${CTX}/${RUN}"
          # prune: keep the latest 30 runs per context
          if [ -d "gh-pages/${CTX}" ]; then
            OLD=$(ls -1 "gh-pages/${CTX}" | grep -E '^[0-9]+$' | sort -n | head -n -30 || true)
            if [ -n "$OLD" ]; then
              echo "Pruning: $OLD"
              echo "$OLD" | xargs -I{} rm -rf "gh-pages/${CTX}/{}"
            fi
          fi
          # next-run history (allure-commandline v2 writes it into the report)
          if [ -f allure-report/history/history.json ]; then
            mkdir -p "gh-pages/${CTX}/history"
            cp allure-report/history/history.json "gh-pages/${CTX}/history/"
          fi
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "Allure report ${CTX}/${RUN} (run ${{ steps.src.outputs.run_id }})"
            git push origin HEAD:gh-pages
          fi
          echo "REPORT_URL=https://wodore.github.io/wodore-frontend-quasar/${CTX}/${RUN}/" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          echo "## Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report:** $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source run:** ${{ steps.src.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
