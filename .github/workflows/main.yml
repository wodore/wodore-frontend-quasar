name: Main

on:
  workflow_dispatch: {}  # manual runs on any branch (PAT PR events can be flaky)
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Read Node.js version from .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          # pnpm store cache (keyed on the lockfile by setup-node)
          cache: pnpm

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.vue', '**/*.js', '.eslintrc.*') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Cache vite/vitest transform cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint --cache --cache-location .eslintcache

      - name: Check formatting
        run: pnpm exec prettier --check "**/*.{js,ts,vue,scss,html,md,json}"

      - name: Type-check
        run: pnpm exec vue-tsc --noEmit

      - name: Run tests
        run: pnpm run test
