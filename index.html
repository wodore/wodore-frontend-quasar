    <!--
      Runtime env: dev and Capacitor builds bake values inline via EJS
      (below). The docker image builds with @@VAR@@ placeholders and
      loads the env from the external /env.js instead (rewritten by
      replace_vars at container start, served no-store, excluded from
      the SW precache) — so the HTML shell carries no volatile values
      and the SEO edge (docker/seo.js) can cache hut pages. See
      services/runtimeEnv.ts and public/env.js.
    -->
    <% const inlineEnv = ctx.dev || ctx.mode.capacitor || ctx.mode.cordova ||
    !process.env.WODORE_EXTERNAL_ENV; %> <% if (inlineEnv) { %>
    <script>
      window.__WODORE_RUNTIME_ENV__ = {
        WODORE_APP_NAME: '<%= process.env.WODORE_APP_NAME %>',
        WODORE_ENV: '<%= process.env.WODORE_ENV %>',
        WODORE_DOMAIN: '<%= process.env.WODORE_DOMAIN %>',
        WODORE_URL: '<%= process.env.WODORE_URL %>',
        WODORE_OFFICIAL_URL: '<%= process.env.WODORE_OFFICIAL_URL %>',
        WODORE_API_HOST: '<%= process.env.WODORE_API_HOST %>',
        WODORE_API_VERSION: '<%= process.env.WODORE_API_VERSION %>',
        WODORE_TILE_SERVER_URL: '<%= process.env.WODORE_TILE_SERVER_URL %>',
        WODORE_IMAGOR_KEY: '<%= process.env.WODORE_IMAGOR_KEY %>',
        WODORE_IMAGOR_URL: '<%= process.env.WODORE_IMAGOR_URL %>',
        WODORE_IMAGOR_REPLACE_API_HOST_MEDIA:
          '<%= process.env.WODORE_IMAGOR_REPLACE_API_HOST_MEDIA %>',
        WODORE_CLOUDINARY_ENV: '<%= process.env.WODORE_CLOUDINARY_ENV %>',
        WODORE_UMAMI_WEBSITE_ID: '<%= process.env.WODORE_UMAMI_WEBSITE_ID %>',
        WODORE_UMAMI_WEBSITE_URL: '<%= process.env.WODORE_UMAMI_WEBSITE_URL %>',
        WODORE_OICD_ISSUER_URL: '<%= process.env.WODORE_OICD_ISSUER_URL %>',
        WODORE_OICD_CLIENT_ID: '<%= process.env.WODORE_OICD_CLIENT_ID %>',
        WODORE_OICD_RESOURCE_ID: '<%= process.env.WODORE_OICD_RESOURCE_ID %>',
        WODORE_MAPTILER_API_KEY: '<%= process.env.WODORE_MAPTILER_API_KEY %>',
        // Error tracking (openspec: add-error-tracking) — empty = inert;
        // same entries as public/env.js for the docker placeholder path.
        WODORE_SENTRY_DSN: '<%= process.env.WODORE_SENTRY_DSN %>',
        WODORE_SENTRY_TRACES_SAMPLE_RATE: '<%= process.env.WODORE_SENTRY_TRACES_SAMPLE_RATE %>',
      };
    </script>
    <% } else { %>
    <script src="/env.js"></script>
    <% } %>
    <script>
      // Preconnect to the cross-origin hosts the app will talk to: the
      // map tile origins are CORS-fetched by MapLibre (~600 ms measured
      // TTFB per origin) and the API host is otherwise only contacted
      // after JS boot. Runs in BOTH env modes — the env above is either
      // baked inline or loaded by the blocking /env.js script, so
      // __WODORE_RUNTIME_ENV__ is already populated here. Missing,
      // empty, @@placeholder@@ or non-URL env values are skipped;
      // origins are deduplicated.
      (() => {
        const env = window.__WODORE_RUNTIME_ENV__ || {};
        const urls = [
          'https://icons.maptoolkit.org',
          'https://tiles.maptoolkit.org',
          'https://tiles.mapterhorn.com',
          env.WODORE_API_HOST,
          env.WODORE_TILE_SERVER_URL,
        ];
        const seen = new Set();
        for (const url of urls) {
          if (!url || url.startsWith('@@')) continue;
          let origin;
          try {
            origin = new URL(url).origin;
          } catch {
            continue;
          }
          if (seen.has(origin)) continue;
          seen.add(origin);
          const link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = origin;
          link.setAttribute('crossorigin', '');
          document.head.appendChild(link);
        }
      })();
    </script>

    <!-- Static boot shell (perf/fast-first-paint) — styles for the
         #wd-boot-shell markup at the top of <body>. Inline CSS only,
         system fonts, no network: first paint must come from this HTML
         while the main bundle downloads. The SEO edge caches this
         document, so nothing volatile may live here beyond the
         build-time productName the <title>/meta already use. -->
    <!-- Theme sniff (review: light-theme flicker) — runs parser-blocking
         so the shell paints in the user's persisted theme instead of
         flashing light first. Mirrors services/theme.ts resolveTheme:
         ui.theme 'light' | 'dark' | 'auto' (default/unknown = auto → OS),
         persisted via @capacitor/preferences on web as
         localStorage['CapacitorStorage.wodore:userSettings'] (JSON,
         storageSet stringifies — see services/storage.ts). Read-only,
         try/catch-guarded: any miss simply stays light and the app's
         theme boot applies the real theme moments later. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('CapacitorStorage.wodore:userSettings');
          var theme = raw ? ((JSON.parse(raw) || {}).ui || {}).theme : undefined;
          var mode = theme === 'light' || theme === 'dark' ? theme : 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-wd-shell', 'dark');
        } catch (e) {
          /* corrupt/absent storage — light shell, app theme boot corrects */
        }
      })();
    </script>
    <style id="wd-boot-shell-style">
      /* Wodore splash (perf/fast-first-paint + owner brief 2026-10):
           bright map-tone paper, charcoal logo with a rotating
           forest-green ring, "wo dore" wordmark. Pixel-identical to
           src/components/map/WdMapLoader.vue so the shell → loader
           handover is invisible (ONE loading screen). Inline CSS only,
           system fonts, no network: first paint must come from this
           HTML while the main bundle downloads. The SEO edge caches
           this document, so nothing volatile may live here beyond the
           build-time productName the <title>/meta already use.
           Both themes keep the bright splash — the map surface is
           light in both lighting conditions (Two-Lights exception);
           the splash prefigures the map, not the chrome. App.vue fades
           the shell out and removes it once mounted. */
      #wd-boot-shell {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        pointer-events: none;
        background-color: #f6f9f7;
        transition: opacity 0.25s ease;
      }
      #wd-boot-shell.wd-boot-shell--out {
        opacity: 0;
      }
      .wd-boot-shell__mark {
        position: relative;
        width: 176px;
        height: 176px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wd-boot-shell__ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 176px;
        height: 176px;
        animation: wd-boot-shell-spin 0.9s linear infinite;
      }
      .wd-boot-shell__ring-track {
        fill: none;
        stroke: #cdd9d2;
        stroke-width: 4;
      }
      .wd-boot-shell__ring-arc {
        fill: none;
        stroke: #346751;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 151 352;
      }
      .wd-boot-shell__logo {
        height: 110px;
        width: auto;
      }
      .wd-boot-shell__wordmark {
        font-family:
          'Barlow Semi Condensed',
          'Barlow',
          -apple-system,
          'Helvetica Neue',
          sans-serif;
        font-size: 2.6rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1;
      }
      .wd-boot-shell__wo {
        color: #1c1c1c;
      }
      .wd-boot-shell__dore {
        color: #bfab25;
        font-weight: 400;
      }
      @keyframes wd-boot-shell-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .wd-boot-shell__ring {
          animation: none;
        }
      }
    </style>
  </head>
