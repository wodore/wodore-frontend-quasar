<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wodore Outdoor style preview</title>
    <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #status {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 10;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #333;
        background: rgba(255, 255, 255, 0.85);
        padding: 6px 8px;
        border-radius: 6px;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">loading…</div>
    <script type="module">
      import * as maplibregl from '/node_modules/maplibre-gl/dist/maplibre-gl.mjs';
      import mlcontour from '/node_modules/maplibre-contour/dist/index.mjs';

      const { Map, addProtocol } = maplibregl;

      const params = new URLSearchParams(location.search);
      const styleUrl = params.get('style') || '/public/styles/outdoor/style.json';
      const lon = parseFloat(params.get('lon') ?? '9.1092109');
      const lat = parseFloat(params.get('lat') ?? '46.6970811');
      const zoom = parseFloat(params.get('z') ?? '13');
      const pitch = parseFloat(params.get('pitch') ?? '0');
      const bearing = parseFloat(params.get('bearing') ?? '0');

      // Register the client-side contour protocol exactly like the app
      // (src/services/outdoorContours.ts) — id 'dem' must match the style.
      const demSource = new mlcontour.DemSource({
        id: 'dem',
        url: 'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp',
        encoding: 'terrarium',
        maxzoom: 15,
        worker: true,
        cacheSize: 100,
      });
      demSource.setupMaplibre({ addProtocol });

      // MapLibre requires ABSOLUTE sprite URLs (a relative one aborts
      // the whole sprite batch) — resolve the style's assets against
      // the style URL first, exactly like the app's transformStyle
      // pinning does (src/stores/map/basemap-store.ts).
      const styleResponse = await fetch(styleUrl);
      const styleJson = await styleResponse.json();
      const styleBase = new URL(styleUrl, location.href);
      // URL() percent-encodes the glyphs template tokens — decode them
      // back (MapLibre requires {fontstack}/{range} verbatim)
      const abs = u => new URL(u, styleBase).href.replaceAll('%7B', '{').replaceAll('%7D', '}');
      if (typeof styleJson.glyphs === 'string') {
        styleJson.glyphs = abs(styleJson.glyphs);
      }
      if (Array.isArray(styleJson.sprite)) {
        styleJson.sprite = styleJson.sprite.map(s =>
          typeof s === 'string'
            ? abs(s)
            : { ...s, url: abs(s.url) + (s.url.includes('sprites/wd') ? '?sv=' + (params.get('sv') ?? '1') : '') }
        );
      } else if (typeof styleJson.sprite === 'string') {
        styleJson.sprite = abs(styleJson.sprite);
      }

      const map = new Map({
        container: 'map',
        style: styleJson,
        center: [lon, lat],
        zoom,
        pitch,
        bearing,
        pixelRatio: parseFloat(params.get('dpr') ?? '1'),
        attributionControl: { compact: false },
      });
      window.map = map;
      window.__flyTo = (lon, lat, z, opts = {}) =>
        map.flyTo({ center: [lon, lat], zoom: z, ...opts });
      window.__easeTo = opts => map.easeTo(opts);

      let errors = 0;
      const status = document.getElementById('status');
      map.on('error', e => {
        errors++;
        console.warn('[map error]', e?.error?.message ?? e);
      });
      map.on('load', () => (status.dataset.loaded = '1'));
      const render = () => {
        const z = map.getZoom().toFixed(2);
        const c = map.getCenter();
        status.textContent = `z ${z}  lon ${c.lng.toFixed(4)} lat ${c.lat.toFixed(4)}  errors ${errors}  loaded ${status.dataset.loaded ? 'yes' : 'no'}`;
        requestAnimationFrame(render);
      };
      render();
    </script>
  </body>
</html>
